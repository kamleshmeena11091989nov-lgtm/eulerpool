name: Run Webull Market Data Script
on:
  workflow_dispatch:      # manual trigger from the Actions tab
  # schedule:              # uncomment to run on a schedule
  #   - cron: "30 13 * * 1-5"   # 9:30am ET, Mon-Fri (adjust for DST)
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run script
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          POLYGON_TEST_SYMBOL: AAPL
        run: python webull_market_data.py
